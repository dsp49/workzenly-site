<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workzenly</title>
  <meta name="description" content="Workzenly — coming soon.">
  <style>
    :root { --bg: #0b1020; --text: #f5f7ff; --muted: #a9b1d6; --accent: #4f7cff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px 16px; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    h1 { font-size: clamp(2.5rem, 7vw, 4.5rem); letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    p { margin-top: 16px; font-size: 1.15rem; color: var(--muted); max-width: 560px; line-height: 1.6; }
    footer { position: fixed; bottom: 20px; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Work<span>zenly</span></h1>
  <p>Something new is on the way. Check back soon.</p>
  <footer>&copy; 2026 Workzenly</footer>
</body>
</html>
